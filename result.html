<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMA Test Portal | Result Analysis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } }
      }
    }
  </script>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">
          SMA
        </div>
        <span class="font-bold text-lg tracking-tight">Performance Analysis</span>
      </div>
      <a href="index.html" class="text-sm font-semibold px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white">
        Back to Home
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full space-y-8">

    <!-- Score Summary Card -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 md:p-8 shadow-sm">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-slate-100 dark:border-slate-800 pb-6">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Scorecard</span>
          <h2 id="res-test-title" class="text-2xl md:text-3xl font-bold mt-1 text-slate-900 dark:text-white">Test Results</h2>
          <p id="res-submitted-at" class="text-xs text-slate-500 dark:text-slate-400 mt-1"></p>
        </div>
        <div class="flex items-baseline gap-2 bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-100 dark:border-indigo-900/50 px-6 py-4 rounded-xl">
          <span class="text-3xl md:text-4xl font-black text-indigo-600 dark:text-indigo-400" id="res-score">0</span>
          <span class="text-slate-400 font-semibold" id="res-total-marks">/ 0</span>
        </div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6">
        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 text-center">
          <span class="text-xs text-slate-500 dark:text-slate-400">Accuracy</span>
          <div class="text-xl font-bold mt-1 text-slate-800 dark:text-slate-200" id="res-accuracy">0%</div>
        </div>
        <div class="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-100 dark:border-emerald-900/30 text-center">
          <span class="text-xs text-emerald-600 dark:text-emerald-400">Correct</span>
          <div class="text-xl font-bold mt-1 text-emerald-600 dark:text-emerald-400" id="res-correct-count">0</div>
        </div>
        <div class="p-4 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-100 dark:border-rose-900/30 text-center">
          <span class="text-xs text-rose-600 dark:text-rose-400">Incorrect</span>
          <div class="text-xl font-bold mt-1 text-rose-600 dark:text-rose-400" id="res-incorrect-count">0</div>
        </div>
        <div class="p-4 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-100 dark:border-amber-900/30 text-center">
          <span class="text-xs text-amber-600 dark:text-amber-400">Unattempted</span>
          <div class="text-xl font-bold mt-1 text-amber-600 dark:text-amber-400" id="res-unattempted-count">0</div>
        </div>
      </div>
    </div>

    <!-- Detailed Question Review Section -->
    <section class="space-y-6">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-bold text-slate-900 dark:text-white">Question-by-Question Breakdown</h3>
      </div>

      <div id="questions-review-container" class="space-y-6">
        <!-- Injected via JavaScript -->
      </div>
    </section>

  </main>

  <script>
    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    function evaluateSubmission(data) {
      let totalScore = 0;
      let correct = 0;
      let incorrect = 0;
      let unattempted = 0;

      const evaluatedQuestions = data.questions.map((q, idx) => {
        const userResp = data.userResponses[q.id]?.value;
        let status = 'unattempted'; // 'correct' | 'incorrect' | 'unattempted'
        let marksScored = 0;
        let formattedUserAnswer = 'Not Answered';
        let formattedCorrectAnswer = '';

        const posMark = q.marking?.correct || q.marking?.full || 4;
        const negMark = q.marking?.incorrect !== undefined ? q.marking.incorrect : 0;

        if (q.type === 'single_choice') {
          formattedCorrectAnswer = `(${String.fromCharCode(65 + q.correctOption)}) ${q.options[q.correctOption]}`;
          if (userResp !== null && userResp !== undefined) {
            formattedUserAnswer = `(${String.fromCharCode(65 + userResp)}) ${q.options[userResp]}`;
            if (userResp === q.correctOption) {
              status = 'correct';
              marksScored = posMark;
              correct++;
            } else {
              status = 'incorrect';
              marksScored = negMark;
              incorrect++;
            }
          } else {
            unattempted++;
          }
        } else if (q.type === 'multiple_choice') {
          const sortedCorrect = [...q.correctOptions].sort();
          formattedCorrectAnswer = sortedCorrect.map(i => `(${String.fromCharCode(65 + i)}) ${q.options[i]}`).join(', ');
          
          if (Array.isArray(userResp) && userResp.length > 0) {
            const sortedUser = [...userResp].sort();
            formattedUserAnswer = sortedUser.map(i => `(${String.fromCharCode(65 + i)}) ${q.options[i]}`).join(', ');

            const isExact = JSON.stringify(sortedUser) === JSON.stringify(sortedCorrect);
            if (isExact) {
              status = 'correct';
              marksScored = posMark;
              correct++;
            } else {
              status = 'incorrect';
              marksScored = negMark;
              incorrect++;
            }
          } else {
            unattempted++;
          }
        } else if (q.type === 'numerical') {
          formattedCorrectAnswer = `${q.correctValue}`;
          if (userResp !== null && userResp !== undefined && userResp !== '') {
            formattedUserAnswer = `${userResp}`;
            if (Number(userResp) === Number(q.correctValue)) {
              status = 'correct';
              marksScored = posMark;
              correct++;
            } else {
              status = 'incorrect';
              marksScored = negMark;
              incorrect++;
            }
          } else {
            unattempted++;
          }
        }

        totalScore += marksScored;

        return {
          ...q,
          index: idx + 1,
          status,
          marksScored,
          formattedUserAnswer,
          formattedCorrectAnswer
        };
      });

      const totalAttempted = correct + incorrect;
      const accuracy = totalAttempted > 0 ? Math.round((correct / totalAttempted) * 100) : 0;

      return {
        totalScore,
        correct,
        incorrect,
        unattempted,
        accuracy,
        evaluatedQuestions
      };
    }

    function renderResults() {
      const rawData = sessionStorage.getItem('sma_active_result');
      if (!rawData) {
        document.body.innerHTML = `
          <div class="p-12 text-center">
            <h2 class="text-xl font-bold">No test session found</h2>
            <p class="text-slate-500 mt-2">Please take a test first from the home portal.</p>
            <a href="index.html" class="inline-block mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg">Return to Home</a>
          </div>`;
        return;
      }

      const data = JSON.parse(rawData);
      const stats = evaluateSubmission(data);

      document.getElementById('res-test-title').innerText = data.testTitle;
      document.getElementById('res-submitted-at').innerText = `Submitted on ${data.submittedAt}`;
      document.getElementById('res-score').innerText = stats.totalScore;
      document.getElementById('res-total-marks').innerText = `/ ${data.totalMarks}`;
      document.getElementById('res-accuracy').innerText = `${stats.accuracy}%`;
      document.getElementById('res-correct-count').innerText = stats.correct;
      document.getElementById('res-incorrect-count').innerText = stats.incorrect;
      document.getElementById('res-unattempted-count').innerText = stats.unattempted;

      const container = document.getElementById('questions-review-container');
      container.innerHTML = '';

      stats.evaluatedQuestions.forEach(q => {
        let statusBadge = '';
        let borderClass = '';

        if (q.status === 'correct') {
          statusBadge = `<span class="px-2.5 py-1 bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 font-bold text-xs rounded-full border border-emerald-200 dark:border-emerald-800">Correct (+${q.marksScored})</span>`;
          borderClass = 'border-l-4 border-l-emerald-500';
        } else if (q.status === 'incorrect') {
          statusBadge = `<span class="px-2.5 py-1 bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-400 font-bold text-xs rounded-full border border-rose-200 dark:border-rose-800">Incorrect (${q.marksScored})</span>`;
          borderClass = 'border-l-4 border-l-rose-500';
        } else {
          statusBadge = `<span class="px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold text-xs rounded-full border border-slate-200 dark:border-slate-700">Unattempted (0)</span>`;
          borderClass = 'border-l-4 border-l-slate-400';
        }

        const card = document.createElement('div');
        card.className = `bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-5 md:p-6 shadow-sm ${borderClass} space-y-4`;

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">${q.subject} • Question ${q.index}</span>
            ${statusBadge}
          </div>

          <div class="text-slate-800 dark:text-slate-100 text-base leading-relaxed">
            ${q.question}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 text-sm">
            <div class="p-3 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800">
              <span class="text-xs font-semibold text-slate-400 block mb-1">Your Answer</span>
              <div class="font-medium ${q.status === 'correct' ? 'text-emerald-600 dark:text-emerald-400' : q.status === 'incorrect' ? 'text-rose-600 dark:text-rose-400' : 'text-slate-500'}">
                ${q.formattedUserAnswer}
              </div>
            </div>

            <div class="p-3 rounded-lg bg-emerald-50/50 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-900/40">
              <span class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 block mb-1">Correct Answer</span>
              <div class="font-medium text-emerald-700 dark:text-emerald-300">
                ${q.formattedCorrectAnswer}
              </div>
            </div>
          </div>

          ${q.solution ? `
            <div class="mt-4 p-4 rounded-xl bg-indigo-50/40 dark:bg-indigo-950/20 border border-indigo-100 dark:border-indigo-900/40 text-sm">
              <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 block mb-1">Step-by-Step Explanation:</span>
              <div class="text-slate-700 dark:text-slate-300 leading-relaxed">${q.solution}</div>
            </div>
          ` : ''}
        `;

        container.appendChild(card);
      });

      setTimeout(renderMath, 20);
    }

    window.addEventListener('DOMContentLoaded', renderResults);
  </script>
</body>
</html>
