<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEE Main Tests & DPPs | SMA Test Portal</title>
  <meta name="description" content="JEE Main 300 Marks full-syllabus mocks and chapter-wise daily practice problem sets." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-black text-sm shadow-sm">SMA</div>
        <div class="leading-tight">
          <span class="font-extrabold text-base tracking-tight block">JEE Main Archive</span>
          <span class="text-[10px] text-indigo-600 dark:text-indigo-400 font-bold uppercase tracking-wider block">Full Length & DPPs</span>
        </div>
      </a>
      <a href="index.html" class="text-xs md:text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-indigo-600">← Portal Home</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 md:py-10 flex-1 w-full space-y-6">
    <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div>
        <h1 class="text-2xl font-black text-slate-900 dark:text-white">JEE Main Examination Library</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">300 Marks NTA Pattern Computer Based Tests</p>
      </div>

      <!-- Search Bar -->
      <div class="relative w-full sm:max-w-xs">
        <input type="text" id="test-search" oninput="applyFilters()" placeholder="Filter JEE Main tests or topics..." 
               class="w-full pl-9 pr-4 py-2 text-xs md:text-sm rounded-xl border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs" />
        <span class="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
      </div>
    </div>

    <!-- Grid -->
    <div id="tests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full py-16 text-center text-slate-400 animate-pulse text-xs">Loading JEE Main tests...</div>
    </div>

    <!-- Pagination Button -->
    <div class="text-center pt-2">
      <button id="load-more-btn" onclick="loadMoreTests()" class="hidden px-6 py-3 rounded-xl border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs md:text-sm font-bold shadow-xs hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
        Load More Tests ↓
      </button>
    </div>
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-400">
    Designed for JEE Main Aspirants • SMA Portal
  </footer>

  <script>
    let allTests = [];
    let filteredTests = [];
    let visibleCount = 9;
    const PAGE_SIZE = 9;

    async function initCategoryHub() {
      try {
        const res = await fetch(`./assets/tests-manifest.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Could not load tests-manifest.json");
        const raw = await res.json();
        allTests = raw.filter(t => t.exam === 'jee-main' || (t.badge && t.badge.toLowerCase().includes('jee main')));
        applyFilters();
      } catch (err) {
        console.error(err);
        document.getElementById('tests-grid').innerHTML = `
          <div class="col-span-full py-12 text-center text-rose-500 font-semibold text-xs">
            ⚠️ Failed to load tests catalog. Please refresh the page.
          </div>`;
      }
    }

    function applyFilters() {
      const query = (document.getElementById('test-search')?.value || '').toLowerCase().trim();
      filteredTests = allTests.filter(t => !query || 
        (t.title && t.title.toLowerCase().includes(query)) ||
        (t.syllabus && t.syllabus.toLowerCase().includes(query))
      );
      renderTests();
    }

    function loadMoreTests() {
      visibleCount += PAGE_SIZE;
      renderTests();
    }

    function renderTests() {
      const grid = document.getElementById('tests-grid');
      const loadMoreBtn = document.getElementById('load-more-btn');
      if (!grid) return;

      const toDisplay = filteredTests.slice(0, visibleCount);

      if (toDisplay.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-xs text-slate-400">No JEE Main tests matching your query.</div>`;
        if (loadMoreBtn) loadMoreBtn.classList.add('hidden');
        return;
      }

      grid.innerHTML = toDisplay.map(t => `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xs hover:border-indigo-500/50 flex flex-col justify-between transition-colors">
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 uppercase tracking-wide">${t.badge || 'JEE Main'}</span>
              <span class="text-[11px] text-slate-400 font-mono">${t.date || ''}</span>
            </div>
            <div>
              <a href="${t.testUrl}" class="group block">
  <h3 class="font-bold text-sm md:text-base text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 line-clamp-2 leading-snug transition-colors">
    ${t.title}
  </h3>
</a>
              ${t.syllabus ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">📚 <span class="font-semibold text-slate-700 dark:text-slate-300">Syllabus:</span> ${t.syllabus}</p>` : ''}
            </div>
          </div>
          
          <div class="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">⏱ ${t.duration} • 📝 ${t.questionsCount} Qs</span>
            <div class="flex gap-1.5">
              <a href="${t.resultUrl}" class="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs">Solutions</a>
              <a href="${t.testUrl}" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-xs">Start</a>
            </div>
          </div>
        </div>
      `).join('');

      if (loadMoreBtn) {
        if (visibleCount < filteredTests.length) {
          loadMoreBtn.classList.remove('hidden');
        } else {
          loadMoreBtn.classList.add('hidden');
        }
      }
    }

    window.addEventListener('DOMContentLoaded', initCategoryHub);
  </script>
</body>
</html>
