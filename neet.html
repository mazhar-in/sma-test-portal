<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEET UG Tests & DPPs | SMA Test Portal</title>
  <meta name="description" content="Speed and precision-based online CBT mock tests calibrated for NEET UG medical aspirants." />
  <link rel="canonical" href="https://tests.smaphysics.com/neet.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- Brand Logo -->
      <a href="index.html" class="flex items-center space-x-2.5 shrink-0">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-black text-sm shadow-sm">SMA</div>
        <div class="leading-tight">
          <span class="font-extrabold text-sm sm:text-base tracking-tight block text-slate-900 dark:text-white">NEET UG Hub</span>
          <span class="text-[9px] sm:text-[10px] text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-wider block">Medical Mock Portal</span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center space-x-1 text-xs sm:text-sm font-semibold">
        <a href="index.html" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">Portal Home</a>
        <a href="jee-main.html" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-indigo-600 dark:text-indigo-400 font-bold transition-colors">JEE Main</a>
        <a href="jee-advanced.html" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-amber-600 dark:text-amber-400 font-bold transition-colors">JEE Advanced</a>
        <a href="neet.html" class="px-3 py-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/70 text-emerald-600 dark:text-emerald-400 font-bold transition-colors">NEET</a>
      </nav>

      <!-- Mobile Compact Segmented Nav -->
      <nav class="flex md:hidden items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200/80 dark:border-slate-700/80 text-[11px] font-bold">
        <a href="index.html" class="px-2.5 py-1 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 transition-colors">Home</a>
        <a href="jee-main.html" class="px-2.5 py-1 rounded-lg text-indigo-600 dark:text-indigo-400 hover:bg-white dark:hover:bg-slate-700 transition-colors">Main</a>
        <a href="jee-advanced.html" class="px-2.5 py-1 rounded-lg text-amber-600 dark:text-amber-400 hover:bg-white dark:hover:bg-slate-700 transition-colors">Adv</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 md:py-10 flex-1 w-full space-y-6">
    <!-- Header Row -->
    <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div>
        <h1 class="text-2xl font-black text-slate-900 dark:text-white">NEET UG Examination Library</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Speed, Accuracy & NCERT-Aligned Test Series</p>
      </div>

      <!-- Search Bar -->
      <div class="relative w-full sm:max-w-xs">
        <input type="text" id="test-search" oninput="applyFilters()" placeholder="Filter NEET tests or topics..." 
               class="w-full pl-9 pr-4 py-2 text-xs md:text-sm rounded-xl border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs" />
        <span class="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="tests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full py-16 text-center text-slate-400 animate-pulse text-xs">Loading NEET tests...</div>
    </div>

    <!-- Pagination Button -->
    <div class="text-center pt-2">
      <button id="load-more-btn" onclick="loadMoreTests()" class="hidden px-6 py-3 rounded-xl border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs md:text-sm font-bold shadow-xs hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
        Load More Tests ↓
      </button>
    </div>
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-400">
    Designed for NEET Medical Aspirants • SMA Portal
  </footer>

  <script>
    let allTests = [];
    let filteredTests = [];
    let visibleCount = 9;
    const PAGE_SIZE = 9;

    function extractTestNum(title, id) {
      const match = (title + ' ' + id).match(/(?:DPP|Test|No)[\s\-_]*(\d+)/i);
      return match ? parseInt(match[1], 10) : 0;
    }

    async function initCategoryHub() {
      try {
        const res = await fetch(`./assets/tests-manifest.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Could not load tests-manifest.json");
        const raw = await res.json();
        
        allTests = raw
          .filter(t => t.exam === 'neet' || (t.badge && t.badge.toLowerCase().includes('neet')))
          .sort((a, b) => {
            const dateDiff = (b.date || '').localeCompare(a.date || '');
            if (dateDiff !== 0) return dateDiff;
            const numDiff = extractTestNum(b.title, b.id) - extractTestNum(a.title, a.id);
            if (numDiff !== 0) return numDiff;
            return (b.title || '').localeCompare(a.title || '');
          });

        applyFilters();
      } catch (err) {
        console.error(err);
        document.getElementById('tests-grid').innerHTML = `
          <div class="col-span-full py-12 text-center text-rose-500 font-semibold text-xs">
            ⚠️ Failed to load tests catalog. Please refresh the page.
          </div>`;
      }
    }

    function applyFilters() {
      const query = (document.getElementById('test-search')?.value || '').toLowerCase().trim();
      filteredTests = allTests.filter(t => !query || 
        (t.title && t.title.toLowerCase().includes(query)) ||
        (t.syllabus && t.syllabus.toLowerCase().includes(query))
      );
      renderTests();
    }

    function loadMoreTests() {
      visibleCount += PAGE_SIZE;
      renderTests();
    }

    function renderTests() {
      const grid = document.getElementById('tests-grid');
      const loadMoreBtn = document.getElementById('load-more-btn');
      if (!grid) return;

      const toDisplay = filteredTests.slice(0, visibleCount);

      if (toDisplay.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-xs text-slate-400">No NEET tests matching your query.</div>`;
        if (loadMoreBtn) loadMoreBtn.classList.add('hidden');
        return;
      }

      grid.innerHTML = toDisplay.map(t => `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xs hover:border-emerald-500/50 flex flex-col justify-between transition-colors">
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 uppercase tracking-wide">${t.badge || 'NEET'}</span>
              <span class="text-[11px] text-slate-400 font-mono">${t.date || ''}</span>
            </div>
            <div>
              <a href="${t.testUrl}" class="group block">
                <h3 class="font-bold text-sm md:text-base text-slate-900 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 line-clamp-2 leading-snug transition-colors">
                  ${t.title}
                </h3>
              </a>
              ${t.syllabus ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 line-clamp-2 leading-relaxed">📚 <span class="font-semibold text-slate-700 dark:text-slate-300">Syllabus:</span> ${t.syllabus}</p>` : ''}
            </div>
          </div>
          
          <div class="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">⏱ ${t.duration} • 📝 ${t.questionsCount} Qs</span>
            <div class="flex gap-1.5">
              <a href="${t.resultUrl}" class="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs">Solutions</a>
              <a href="${t.testUrl}" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-xs shadow-xs">Start</a>
            </div>
          </div>
        </div>
      `).join('');

      if (loadMoreBtn) {
        if (visibleCount < filteredTests.length) {
          loadMoreBtn.classList.remove('hidden');
        } else {
          loadMoreBtn.classList.add('hidden');
        }
      }
    }

    window.addEventListener('DOMContentLoaded', initCategoryHub);
  </script>
</body>
</html>
