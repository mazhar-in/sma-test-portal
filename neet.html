<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  
  <title>NEET Mock Test Series | SMA Test Portal</title>
  <meta name="description" content="Free NTA NEET pattern mock tests covering Physics, Chemistry, and Biology. Timed test series, full solutions, and score analysis." />
  <meta name="robots" content="index, follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>

  <style>
    .badge-neet { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    @media (prefers-color-scheme: dark) {
      .badge-neet { background-color: rgba(21, 128, 61, 0.2); color: #86efac; border-color: rgba(74, 222, 128, 0.3); }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-14 md:h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2.5 group">
        <div class="w-8 h-8 rounded-lg bg-emerald-600 group-hover:bg-emerald-500 text-white flex items-center justify-center font-extrabold text-sm shadow-sm transition-colors">
          SMA
        </div>
        <span class="font-bold text-lg md:text-xl tracking-tight group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">
          SMA NEET Portal
        </span>
      </a>
      
      <!-- Category Switcher -->
      <nav class="flex items-center space-x-2 text-xs md:text-sm font-semibold">
        <a href="jee-main.html" class="px-2.5 py-1 text-slate-500 hover:text-slate-900 dark:hover:text-white">JEE Main</a>
        <a href="jee-advanced.html" class="px-2.5 py-1 text-slate-500 hover:text-slate-900 dark:hover:text-white">JEE Adv</a>
        <span class="px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800">NEET</span>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 md:py-8 flex-1 w-full space-y-8 md:space-y-10">

    <!-- Latest NEET Drop Spotlight -->
    <section aria-labelledby="latest-drop-heading">
      <div class="flex items-center space-x-2 mb-3">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <h2 id="latest-drop-heading" class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
          Featured NEET Drop
        </h2>
      </div>
      <div id="latest-test-container">
        <div class="p-6 md:p-8 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 animate-pulse h-44"></div>
      </div>
    </section>

    <!-- NEET Test Archive -->
    <section class="space-y-4">
      <div class="border-b border-slate-200 dark:border-slate-800 pb-3">
        <h3 class="text-xl md:text-2xl font-bold tracking-tight">NEET (UG) Test Series Archive</h3>
        <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400">Timed practice drills formatted to the official NTA NEET pattern.</p>
      </div>

      <div id="archive-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
    </section>

  </main>

  <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs md:text-sm text-slate-500 dark:text-slate-400">
    <p><a href="index.html" class="font-semibold text-slate-800 dark:text-slate-200 hover:underline">SMA Test Portal</a> • NEET Assessment Series</p>
  </footer>

  <script>
    const CATEGORY = 'neet';

    function renderLatestTest(test) {
      const container = document.getElementById('latest-test-container');
      if (!test) {
        container.innerHTML = `<div class="p-6 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 text-center text-slate-500 text-sm">No active NEET tests available right now.</div>`;
        return;
      }
      container.innerHTML = `
        <div class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 text-white rounded-2xl p-5 md:p-8 shadow-xl border border-emerald-900/50">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">
            <div class="space-y-2.5">
              <span class="inline-block text-[11px] md:text-xs font-bold px-2.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                ${test.badge}
              </span>
              <h3>
                <a href="${test.testUrl}" class="text-xl md:text-3xl font-bold tracking-tight text-white hover:text-emerald-300 transition-colors block">
                  ${test.title}
                </a>
              </h3>
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs md:text-sm text-slate-300">
                <span>⏱ ${test.duration}</span> • <span>📝 ${test.questionsCount} Questions</span> • <span>📅 ${test.date}</span>
              </div>
            </div>
            <div>
              <a href="${test.testUrl}" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3.5 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white shadow-lg transition-transform">
                Start Test Now →
              </a>
            </div>
          </div>
        </div>`;
    }

    function renderArchive(tests) {
      const grid = document.getElementById('archive-grid');
      grid.innerHTML = '';
      if (tests.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center py-8 text-slate-400 text-sm">No archived NEET tests found.</p>`;
        return;
      }
      tests.forEach(test => {
        const card = document.createElement('article');
        card.className = "bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 md:p-5 shadow-sm flex flex-col justify-between space-y-4 hover:border-emerald-500/50 transition-colors";
        card.innerHTML = `
          <div class="space-y-2">
            <div class="flex justify-between items-start">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded badge-neet">${test.badge}</span>
              <span class="text-xs text-slate-400">${test.date}</span>
            </div>
            <h4 class="font-bold text-base md:text-lg leading-snug">
              <a href="${test.testUrl}" class="text-slate-900 dark:text-slate-100 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors block">
                ${test.title}
              </a>
            </h4>
            <div class="text-xs text-slate-500 dark:text-slate-400 flex gap-2">
              <span>⏱ ${test.duration}</span> • <span>📝 ${test.questionsCount} Questions</span>
            </div>
          </div>
          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <a href="${test.testUrl}" class="text-xs md:text-sm font-bold text-emerald-600 dark:text-emerald-400 py-1 hover:underline">Take Test →</a>
            <a href="${test.resultUrl}" class="text-xs font-semibold text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 py-1">Solutions</a>
          </div>`;
        grid.appendChild(card);
      });
    }

    async function loadCategoryTests() {
      try {
        const res = await fetch('assets/tests-manifest.json');
        const allTests = await res.json();
        const categoryTests = allTests.filter(t => t.exam === CATEGORY);
        
        const latest = categoryTests.find(t => t.isLatest) || categoryTests[0];
        renderLatestTest(latest);
        renderArchive(categoryTests);
      } catch (err) {
        console.error("Failed to load NEET tests:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadCategoryTests);
  </script>
</body>
</html>
